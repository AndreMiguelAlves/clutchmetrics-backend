spring.application.name=clutchmetrics-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clutchmetrics
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email - Mailpit
spring.mail.host=localhost
spring.mail.port=1025

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.from=no-reply@clutchmetrics.local

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000


# ==========================================
# CLUTCHMETRICS - VIDEO UPLOAD
# ==========================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB


# Error response security
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never


# URL base da aplicação
app.base-url=http://localhost:8080

# Server
server.port=8080